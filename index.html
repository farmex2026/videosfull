const OPERARIOS=[{id:'juan',nombre:'Juan Cruz',escala:true},{id:'maxi',nombre:'Maxi',escala:false}];
const TIPOS_SERV=[{id:'Express',nombre:'Express'},{id:'Completo',nombre:'Completo'},{id:'Premium',nombre:'Premium'}];
const COM_BASE=1.5, COM_ALTA=2, UMBRAL_PREMIUM=50;

async function control(){
  if(!S.ctrl) S.ctrl=await leer('boxes:control',{});
  return S.ctrl;
}
const claveCtrl=(f,i,orden)=>orden?('o:'+orden):(f+'#'+i);

// cuenta comisiones de un mes: Juan Cruz salta a 2% si supera el 50% de Premium
function liquidar(regs){
  const out={};
  OPERARIOS.forEach(op=>out[op.id]={n:0,porTipo:{},venta:0,premium:0});
  Object.values(regs).forEach(r=>{
    const o=out[r.op]; if(!o) return;
    o.n++; o.venta+=Number(r.importe)||0;
    o.porTipo[r.tipo]=(o.porTipo[r.tipo]||0)+1;
    if(r.tipo==='Premium') o.premium++;
  });
  OPERARIOS.forEach(op=>{
    const o=out[op.id];
    o.pct=o.n?o.premium/o.n*100:0;
    o.tasa=(op.escala&&o.pct>=UMBRAL_PREMIUM)?COM_ALTA:COM_BASE;
    o.comision=o.venta*o.tasa/100;
    // cuántos Premium más necesita para llegar al 2%
    if(op.escala&&o.tasa===COM_BASE&&o.n){
      let faltan=0, p=o.premium, n=o.n;
      while(p/n*100<UMBRAL_PREMIUM&&faltan<9999){ p++; n++; faltan++; }
      o.faltan=faltan;
    }
  });
  return out;
}

/* ---------- objetivos de Boxes ---------- */
const METS_BOXES=[
  {k:'serv',rot:'Servicios',uni:'sv',ayuda:'Premium + Completo + Express del trimestre'},
  {k:'lubri',rot:'Lubricante',uni:'L',ayuda:'Litros comprados en el trimestre'}
];
const objBV=(o,ym,k,q)=>Number(((o[ym]||{})[k]||{})[q])||0;
function objBVigente(o,anio,meses,k){
  let mes=null;
  meses.forEach(m=>{ if(objBV(o,`${anio}-${m}`,k,'min')||objBV(o,`${anio}-${m}`,k,'max')) mes=m; });
  if(!mes) return {mes:null,min:0,max:0,cubre:[]};
  return {mes,min:objBV(o,`${anio}-${mes}`,k,'min'),max:objBV(o,`${anio}-${mes}`,k,'max'),
          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}
// litros de lubricante: por ahora se cargan a mano; después van a salir de las facturas de YPF
async function litrosLubri(){
  if(!S.lubri) S.lubri=await leer('boxes:lubricante',{});
  return S.lubri;
}
const realServ=(r,anio,meses)=>meses.reduce((a,m)=>a+((r[`${anio}-${m}`]||{}).n||0),0);
const realLubri=(L,anio,meses)=>meses.reduce((a,m)=>a+(Number(L[`${anio}-${m}`])||0),0);

      <div class="totem-total"><span class="nom">Lubricante</span><span class="val">${nf(real.lubri)}<i>L</i></span></div>
    </div>
    ${METS_BOXES.map(m=>{

  return `<div class="envoltorio">

      `<button data-anio="${a}" aria-current="${y1===a}">${a} vs ${y2}</button>`).join('')}</div>`:''}

        ${digitos(t2)}<div class="pie">Servicios realizados</div></div>
    </div>
    ${comp.length&&comp.length<12?`<div class="aviso">La variación toma los meses con datos en los dos años: <strong>${comp.map(m=>MESES[m]).join(', ')}</strong>.</div>`:''}
    <div class="tarjeta">
      <h2>Servicios por mes</h2>
      <p class="sub">${y1} contra ${y2}. Pasá el mouse o tocá un mes.</p>
      <div class="graf"><div class="graf-in">${MESES.map((mm,m)=>`<div class="col" data-i="${m}" tabindex="0">
        <div class="barras"><div class="b b1" style="height:${(s1[m]||0)/max*100}%"></div>
        <div class="b b2" style="height:${(s2[m]||0)/max*100}%"></div></div>
        <div class="et">${mm}</div></div>`).join('')}</div><div class="tip" id="tipGraf"></div></div>
      <div class="leyenda"><span><i style="background:#5B6B8F"></i>${y1}</span><span><i style="background:var(--cian)"></i>${y2}</span></div>
    </div>
    <div class="tarjeta">
      <h2>Mes por mes</h2>
      <div class="scroll"><table>
        <thead><tr><th>Mes</th><th class="num">${y1}</th><th class="num">${y2}</th><th class="num">Var.</th></tr></thead>
        <tbody>${MESES.map((mm,m)=>{
          if(s1[m]===null&&s2[m]===null) return '';
          const v=(s1[m]&&s2[m]!==null)?((s2[m]-s1[m])/s1[m]*100):null;
          return `<tr><td>${MESES_L[m]}</td><td class="num">${s1[m]===null?'—':nf(s1[m])}</td>

      </table></div>
    </div></div>`;
}

async function vistaBoxes(){
  const r=await rollBoxes(), CT=await control();
  const todos=Object.keys(r).sort();
  if(!todos.length) return `<div class="envoltorio"><div class="tarjeta"><h2>Servicios</h2>
    <p class="vacio">Todavía no hay reportes cargados.<br>Se cargan en Administración → Boxes → Reportes de servicios.</p></div></div>`;
  const anios=[...new Set(todos.map(k=>k.slice(0,4)))].sort();
  if(!S.filtro.bxserv){ const u=todos[todos.length-1]; S.filtro.bxserv={a:u.slice(0,4),m:u.slice(5,7)}; }
  let {a:fa,m:fm}=S.filtro.bxserv;
  const hay=(a,m)=>todos.some(k=>(a==='todos'||k.slice(0,4)===a)&&(m==='todos'||k.slice(5,7)===m));
  if(!hay(fa,fm)){ const u=todos[todos.length-1]; fa=u.slice(0,4); fm=u.slice(5,7); S.filtro.bxserv={a:fa,m:fm}; }
  const meses=todos.filter(k=>(fa==='todos'||k.slice(0,4)===fa)&&(fm==='todos'||k.slice(5,7)===fm));
  const rotulo=fa==='todos'&&fm==='todos'?'Todo el período'
    :fa==='todos'?MESES_L[Number(fm)-1]+' · todos los años'
    :fm==='todos'?'Año '+fa:nombreMes(`${fa}-${fm}`);

  // junta los meses del filtro
  const A={n:0,porTipo:{},porMarca:{},porModelo:{},porCanal:{},porHora:{},porDia:{}};
  const jornadas=[]; let aMano=0;
  for(const ym of meses){
    const d=await boxes(ym);
    const sinDetalle=!d||!Object.keys(d.dias||{}).length;
    if(sinDetalle){                       // mes cargado a mano: solo totales
      const t=r[ym]; if(!t) continue;
      aMano++; A.n+=t.n;
      Object.entries(t.porTipo||{}).forEach(([k,v])=>A.porTipo[k]=(A.porTipo[k]||0)+v);
      continue;
    }
    const s=resumenBoxes(d.dias);
    A.n+=s.n;
    ['porTipo','porMarca','porModelo','porCanal','porHora'].forEach(g=>
      Object.entries(s[g]).forEach(([k,v])=>A[g][k]=(A[g][k]||0)+v));
    Object.keys(d.dias).sort().forEach(dia=>jornadas.push({ym,dia,lista:d.dias[dia]}));
  }

  const filtro=`<div class="filtro"><span class="et">Filtrar</span>
    <select id="bxAnio"><option value="todos"${fa==='todos'?' selected':''}>Todos los años</option>
      ${anios.map(x=>`<option value="${x}"${fa===x?' selected':''}>${x}</option>`).join('')}</select>
    <select id="bxMes"><option value="todos"${fm==='todos'?' selected':''}>Todos los meses</option>
      ${MESES_L.map((n,i)=>{const v=String(i+1).padStart(2,'0');
        return `<option value="${v}"${fm===v?' selected':''}>${n}</option>`;}).join('')}</select></div>`;

  // barras horizontales reutilizables
  const barras=(obj,lista,color)=>{
    const items=(lista||Object.entries(obj).sort((x,y)=>y[1]-x[1]).map(([k])=>({id:k,nombre:k})))
      .map(i=>({...i,v:obj[i.id]||0})).filter(i=>i.v);
    const max=Math.max(...items.map(i=>i.v),1);
    return items.map(i=>`<div class="hfila"><div class="hnom">${esc(i.nombre)}</div>
      <div class="hbarras"><div class="hb"><i style="width:${i.v/max*100}%;background:${i.color||color}"></i>
        <em>${nf(i.v)}</em></div></div></div>`).join('');
  };

  // picos por hora
  const horas=[]; for(let x=6;x<=21;x++) horas.push(x);
  const maxH=Math.max(...horas.map(x=>A.porHora[x]||0),1);
  const pico=horas.reduce((b,x)=>(A.porHora[x]||0)>(A.porHora[b]||0)?x:b,horas[0]);

  const filasDia=jornadas.slice().reverse().map(j=>{
    const [aa,mm]=j.ym.split('-');
    const dow=DOW[new Date(`${j.ym}-${j.dia}T12:00:00`).getDay()];
    const t={}; j.lista.forEach(s=>t[s.t]=(t[s.t]||0)+1);
    const kd='bx|'+j.ym+'-'+j.dia;
    return `<details class="dia" data-dia="${kd}"${S.diasAbiertos[kd]?' open':''}><summary>
        <span class="flecha">${ICO.flecha}</span><span class="dow">${dow}</span>
        <span class="f">${j.dia}/${mm}/${aa}</span>
        <span class="tt">${nf(j.lista.length)}<i>serv</i></span></summary>
      <div class="cuerpo-dia">
        ${SERVICIOS.filter(s=>t[s.id]).map(s=>`<div class="turno-fila">
          <span class="ic" style="color:${s.color}">◆</span><span class="nom">${s.nombre}</span>
          <span class="val">${nf(t[s.id])}</span></div>`).join('')}
        ${Object.keys(t).filter(k=>!SERVICIOS.some(s=>s.id===k)).map(k=>`<div class="turno-fila">
          <span class="ic">◆</span><span class="nom">${esc(k)}</span><span class="val">${nf(t[k])}</span></div>`).join('')}
        <div class="desglose">${j.lista.slice().sort((a,b)=>a.h-b.h).map((s,idx)=>{
          const orig=j.lista.indexOf(s);
          const k=claveCtrl(`${j.ym}-${j.dia}`,orig,s.o);
          const hecho=!!CT[k];
          return `<span class="pdt auto-cargable${hecho?' hecho':''}" tabindex="0"
            data-carga="${esc(k)}" data-f="${j.ym}-${j.dia}" data-i="${orig}"
            data-orden="${esc(s.o||'')}" data-veh="${esc(s.ma+' '+s.mo)}" data-h="${s.h}" data-t="${esc(s.t)}"
            title="${hecho?'Cargado · tocá para editar':'Tocá para cargar la comisión'}">
            <b>${String(s.h).padStart(2,'0')}h</b><em>${esc(s.ma)} ${esc(s.mo)}</em>${hecho?' ✓':''}</span>`;}).join('')}</div>
      </div></details>`;
  }).join('');

  const topModelos=Object.entries(A.porModelo).sort((x,y)=>y[1]-x[1]).slice(0,10)
    .map(([k,v])=>({id:k,nombre:k,v}));

  const soloTotales=aMano&&!jornadas.length;
  const tarjeta=(titulo,sub,cuerpo)=>`<div class="tarjeta"><h2>${titulo}</h2>
    ${sub?`<p class="sub">${sub}</p>`:''}${cuerpo}</div>`;

  const bloques=[];
  bloques.push(tarjeta('Tipo de servicio','',`<div class="hgraf">${barras(A.porTipo,SERVICIOS,'var(--cian)')}</div>`));
  if(Object.keys(A.porHora).length){
    bloques.push(tarjeta('Horarios pico',`A qué hora entran los autos. El pico es a las <strong>${pico}:00</strong>.`,
      `<div class="vgraf"><div class="vcols">${horas.map(x=>{
        const v=A.porHora[x]||0;
        return `<div class="vcol"><div class="vbarras"><div class="vb" style="width:70%;max-width:26px">
          ${v?`<em>${v}</em>`:''}<i style="height:${v/maxH*100}%;background:${x===pico?'var(--cian)':'#3E5E8A'}"></i></div></div>
          <div class="vet">${x}</div></div>`;}).join('')}</div></div>`));
  }
  if(Object.keys(A.porCanal).length){
    bloques.push(tarjeta('Canal de origen','Cuántos vienen con turno por la app y cuántos caen de sorpresa.',
      `<div class="hgraf">${barras(A.porCanal,CANALES,'var(--cian)')}</div>`));
  }
  if(Object.keys(A.porMarca).length){
    bloques.push(tarjeta('Marcas','',`<div class="hgraf">${barras(A.porMarca,null,'#9D7CFF')}</div>`));
  }
  if(topModelos.length){
    const maxM=topModelos[0].v;
    bloques.push(tarjeta('Modelos más frecuentes',
      `Los diez que más entraron, de ${nf(Object.keys(A.porModelo).length)} modelos distintos.`,
      `<div class="hgraf">${topModelos.map(i=>`<div class="hfila">
        <div class="hnom" style="font-size:11.5px">${esc(i.nombre)}</div>
        <div class="hbarras"><div class="hb"><i style="width:${i.v/maxM*100}%;background:#3DE0A0"></i><em>${i.v}</em></div></div>
      </div>`).join('')}</div>`));
  }
  if(jornadas.length){
    bloques.push(tarjeta('Día por día',
      `${jornadas.length} días con servicios. Tocá uno para ver qué entró y a qué hora.`,
      `<div class="acordeon">${filasDia}
        <div class="fila-mes"><span class="f">${esc(rotulo)}</span><span class="tt">${nf(A.n)}<i>serv</i></span></div>
      </div>`));
  }

  return `<div class="envoltorio">
    ${filtro}
    ${soloTotales?`<div class="aviso">${meses.length>1?'Estos meses se cargaron':'Este mes se cargó'} a mano, con los totales por tipo de servicio. Los horarios, las marcas y el detalle por día salen del reporte del sistema.</div>`
      :aMano?`<div class="aviso">${aMano} de los meses del filtro se cargaron a mano: cuentan en el total y en los tipos, pero no aportan horarios ni marcas.</div>`:''}
    <div class="totem">
      <div class="totem-cab"><div class="t">Boxes · servicios realizados</div><div class="d">${esc(rotulo)}</div></div>
      ${SERVICIOS.map(s=>`<div class="linea-totem"><span class="chip" style="background:${s.color}"></span>
        <span class="nom">${s.nombre}</span><span class="guia"></span>
        <span class="val">${nf(A.porTipo[s.id]||0)}</span></div>`).join('')}
      <div class="totem-total"><span class="nom">Total</span><span class="val">${nf(A.n)}</span></div>
    </div>
    ${bloques.join('')}

// YPF puntúa así: por debajo del mínimo 0%, en el mínimo 70%, y de ahí sube lineal hasta 100% en el máximo
// color del punto según cómo viene el objetivo
function luzObj(real,min,max){
  const mi=Number(min)||0, ma=Number(max)||0;
  if((!mi&&!ma)||real===''||real===null||real===undefined)
    return {c:'sin',rot:'sin objetivo o sin dato'};
  const p=pctYPF(real,min,max);
  if(p>=100) return {c:'max',rot:'llegó al máximo'};
  if(p>0)    return {c:'min',rot:'pasó el mínimo, va camino al máximo'};
  return {c:'no',rot:'todavía no llega al mínimo'};
}
function pctYPF(real,min,max){
  if(real===null||real===undefined||real==='') return 0;
  const r=Number(real), mi=Number(min)||0, ma=Number(max)||0;
  if(!isFinite(r)) return 0;
  if(!mi&&!ma) return 0;                 // sin objetivo cargado no se puntúa
  if(mi&&r<mi) return 0;
  if(ma&&r>=ma) return 100;
  if(!ma||ma<=mi) return r>=mi?100:0;
  return 70+30*(r-mi)/(ma-mi);
}

const SERVICIOS=[

// del reporte solo se guarda lo que sirve: nada de nombre, DNI, teléfono, mail ni patente
function leerReporteBoxes(filas,nombreArch){
  // el reporte trae arriba una línea de filtros que también dice "Fecha de finalización":
  // el encabezado de verdad es el que tiene además el tipo de trabajo y la marca.
  const esCab=r=>{
    const t=(r||[]).map(c=>norm(c==null?'':c)).join('|');
    return t.indexOf('FECHA DE FINALIZACION')>=0&&t.indexOf('TIPO DE TRABAJO')>=0;
  };
  const iCab=filas.findIndex(esCab);
  if(iCab<0) return {error:`En “${nombreArch}” no encontré la fila de encabezado del listado (con “Fecha de finalización” y “Tipo de trabajo”).`};
  const cab=(filas[iCab]||[]).map(c=>norm(c==null?'':c));
  const buscar=(...pistas)=>{
    for(const p of pistas){ const q=norm(p); const i=cab.findIndex(c=>String(c||'').indexOf(q)>=0); if(i>=0) return i; }
    return -1;
  };
  const iF=buscar('FECHA DE FINALIZACI'), iT=buscar('TIPO DE TRABAJO'),
        iE=buscar('ESTADO'), iM=buscar('ACTIVO: MARCA'), iMo=buscar('ACTIVO: MODELO'),
        iC=buscar('CANAL ORIGEN'), iO=buscar('NUMERO DE ORDEN','NÚMERO DE ORDEN');
  if(iF<0||iT<0) return {error:`En “${nombreArch}” faltan las columnas de fecha o tipo de trabajo.`};

  const servicios=[]; let saltadas=0;
  for(const r0 of filas.slice(iCab+1)){
    const r=r0||[];
    const cf=String(r[iF]??'').trim();
    const m=cf.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\D+(\d{1,2}):(\d{2})/);
    if(!m){ if(cf) saltadas++; continue; }
    const est=String(r[iE]??'').trim();
    if(est&&!/completad/i.test(est)){ saltadas++; continue; }
    const dia=m[1].padStart(2,'0'), mes=m[2].padStart(2,'0');
    servicios.push({
      f:`${m[3]}-${mes}-${dia}`, h:Number(m[4]),
      t:String(r[iT]??'').trim()||'Sin tipo',
      ma:String(r[iM]??'').trim().toUpperCase()||'—',
      mo:String(r[iMo]??'').trim()||'—',
      c:String(r[iC]??'').trim()||'—',
      o:iO>=0?String(r[iO]??'').trim():''
    });
  }
  if(!servicios.length) return {error:`En “${nombreArch}” no encontré servicios completados.`};
  // sin duplicados por número de orden
  const vistos=new Set(), limpio=[];
  for(const s of servicios){
    const k=s.o||`${s.f}|${s.h}|${s.t}|${s.ma}|${s.mo}`;
    if(vistos.has(k)) continue;
    vistos.add(k); limpio.push(s);
  }
  const meses={};
  limpio.forEach(s=>{
    const ym=s.f.slice(0,7), d=s.f.slice(8,10);
    meses[ym]=meses[ym]||{dias:{},n:0};
    (meses[ym].dias[d]=meses[ym].dias[d]||[]).push({h:s.h,t:s.t,ma:s.ma,mo:s.mo,c:s.c});
    meses[ym].n++;
  });
  return {meses,total:limpio.length,saltadas,arch:nombreArch};
}

  let n=0;
  Object.entries(dias).forEach(([d,lista])=>{
    porDia[d]=lista.length; n+=lista.length;
    lista.forEach(s=>{
      porTipo[s.t]=(porTipo[s.t]||0)+1;
      porMarca[s.ma]=(porMarca[s.ma]||0)+1;
      porModelo[s.ma+' '+s.mo]=(porModelo[s.ma+' '+s.mo]||0)+1;
      porCanal[s.c]=(porCanal[s.c]||0)+1;
      porHora[s.h]=(porHora[s.h]||0)+1;

  });
  return {n,porTipo,porMarca,porModelo,porCanal,porHora,porDia};
}

// proveedores de los que entran vencimientos; se administran desde Tienda → Admin
// lectores que ya sé usar, se reconocen por el nombre del proveedor
const LECTORES=[{re:/andreani/i,lector:'andreani'},{re:/panino|grand\s*wich/i,lector:'panino'}];
async function provVenc(){
  if(!S.provV){
    let L=await leer('tienda:proveedores',null);
    if(!L||!L.length) L=[{id:'andreani',nom:'Andreani',lector:'andreani'},
                         {id:'panino',nom:'Panino S.A.',lector:'panino'}];
    // los que cargaste a mano se enganchan con su lector si existe
    let cambio=false;
    L.forEach(p=>{
      const m=LECTORES.find(x=>x.re.test(p.nom||''));
      const l=m?m.lector:'';
      if((p.lector||'')!==l){ p.lector=l; cambio=true; }
    });
    LECTORES.forEach(({re,lector})=>{
      if(!L.some(p=>re.test(p.nom||''))){
        L.push({id:lector,nom:lector==='panino'?'Panino S.A.':'Andreani',lector});
        cambio=true;
      }
    });
    S.provV=L;
    if(cambio) await guardar('tienda:proveedores',L);
  }
  return S.provV;
}
const guardarProvV=()=>guardar('tienda:proveedores',S.provV);
const DIAS_GRACIA=5;    // lo vencido se sigue viendo estos días
const DIAS_AVISO=30;    // se marca lo que vence dentro de este plazo
async function vencimientos(){
  if(!S.venc) S.venc=await leer('tienda:vencimientos',{});
  return S.venc;
}
const diasHasta=f=>Math.round((new Date(f+'T12:00:00')-new Date(hoyISO()+'T12:00:00'))/86400000);
function estadoVenc(f){
  const d=diasHasta(f);
  if(d<0) return {clave:'vencido',rot:'vencido',dias:d};
  if(d===0) return {clave:'hoy',rot:'vence hoy',dias:0};
  if(d<=DIAS_AVISO) return {clave:'pronto',rot:`en ${d} día${d===1?'':'s'}`,dias:d};
  return {clave:'ok',rot:`en ${d} días`,dias:d};
}

/* ---------- facturas de Andreani ---------- */
// renglón: código, descripción, cantidad, importe unitario y, a veces, el neto en la línea de abajo
const RE_AND=/^(\d{6,20})\s+(.+?)\s+(\d{1,5})\s+([\d.]+,\d{2})(?:\s+([\d.]+,\d{2}))?\s*$/;
const RE_SOLO_IMP=/^[\d.]+,\d{2}$/;
const codAnd=c=>String(c).trim();   // tal cual viene en la factura, con los ceros
// Panino: código con letras (04UN031), descripción, cantidad, precio unitario e importe
const RE_PANINO=/^([0-9]{2}[A-Z]{2}[0-9]{3})\s+(.+?)\s+(\d{1,5})[.,]\d{2}\s+([\d.]+)[.,](\d{2})\s+([\d.]+)[.,]\d{2}\s*$/;
function renglonesPanino(lineas){
  const out=[], vistos=new Set();
  for(const raw of lineas){
    const l=String(raw).replace(/\s+/g,' ').trim();
    if(!l) continue;
    const m=l.match(RE_PANINO);
    if(!m) continue;
    const cant=Number(m[3])||0;
    if(!cant) continue;
    const unit=Number(String(m[4]).replace(/\./g,'')+'.'+m[5])||0;
    const neto=Math.round(unit*cant*100)/100;
    const k=m[1]+'|'+cant+'|'+neto;
    if(vistos.has(k)) continue;      // el PDF suele traer la factura repetida
    vistos.add(k);
    out.push({cod:m[1],codOrig:m[1],desc:m[2].trim(),cant,unit,neto});
  }
  return out;
}
function renglonesAndreani(lineas){
  const out=[], vistos=new Set();
  for(let i=0;i<lineas.length;i++){
    const l=String(lineas[i]).replace(/\s+/g,' ').trim();
    if(!l) continue;
    const m=l.match(RE_AND);
    if(!m) continue;
    const cod=codAnd(m[1]), cant=Math.round(numeroSig(m[3]));
    if(!cant) continue;
    const unit=numeroSig(m[4]);
    let neto=m[5]?numeroSig(m[5]):0;
    // si el neto quedó en el renglón siguiente, lo toma de ahí
    if(!neto){
      const sig=String(lineas[i+1]||'').replace(/\s+/g,' ').trim();
      if(RE_SOLO_IMP.test(sig)) neto=numeroSig(sig);
    }
    if(!neto) neto=Math.round(unit*cant*100)/100;
    const k=cod+'|'+neto;
    if(vistos.has(k)) continue;
    vistos.add(k);
    out.push({cod,codOrig:m[1],desc:m[2].trim(),cant,unit,neto});
  }
  return out;
}
// facturas ya cargadas, agrupadas por proveedor y número
async function historialFacturas(){
  const V=await vencimientos();
  const g={};
  Object.entries(V).forEach(([k,v])=>{
    const prov=v.prov||'sin proveedor', nro=v.factura||'sin número';
    const id=prov+'|'+nro;
    if(!g[id]) g[id]={prov,nro,items:[],ts:0,ingreso:v.ingreso||''};
    g[id].items.push({...v,k});
    const t=Number(v.ts)||0; if(t>g[id].ts) g[id].ts=t;
    if(v.ingreso&&(!g[id].ingreso||v.ingreso>g[id].ingreso)) g[id].ingreso=v.ingreso;
  });
  return Object.entries(g).map(([id,x])=>({id,...x}))
    .sort((a,b)=>(b.ingreso||'').localeCompare(a.ingreso||'')||b.ts-a.ts);
}

const RE_TOP=/^(\d{5,9})\s+(.+?)\s+([A-Z]{2,3})\s+(\d{1,5})\s+([\d.]+,\d{2})/;
function renglonesTopaes(lineas){
  const out=[]; const vistos=new Set();
  const corta=/^(CODIGO|SUBTOTAL|TOTAL|IVA|SON |C\.A\.E|IMPORTANTE|NO SE ACEPTAN|Se(ñ|n)or|Domicilio|CUIT|Ingresos|Inicio|Remito|Vencimiento|Moneda|Condicion|Administraci|Centro|Parque|email|IVA RESPONSABLE|FACTURA|Nro\.|Fecha|Cotizaci)/i;
  for(const l0 of lineas){
    const l=String(l0).replace(/\s+/g,' ').trim();
    if(!l||corta.test(l)) continue;
    if(/Cond\.:|%Dto\.|Vencimiento CAE|Fecha Vencimiento/i.test(l)) continue;
    const m=l.match(RE_TOP);
    if(!m) continue;
    const cod=m[1], cant=Math.round(numeroSig(m[4]));
    if(!cant) continue;
    const k=cod+'|'+cant;
    if(vistos.has(k)) continue;
    vistos.add(k);
    out.push({cod,desc:m[2].trim(),cant,pu:numeroSig(m[5])});
  }
  return out;
}

/* ---------- facturas de YPF lubricantes ---------- */
// unidades por caja aprendidas a mano, por código
async function envases(){
  if(!S.envases) S.envases=await leer('ypf:envases',{'185496':12});
  return S.envases;
}
const barraYPF=cod=>String(cod).trim()+'0';
// la presentación es el último patrón N/N de la descripción: "4/4" son 4 por caja,
// "12/1" son 12. La viscosidad no lleva barra (540, 1040), así que no se confunde.
function presentacion(desc){
  const ms=[...String(desc).matchAll(/(\d+)\s*\/\s*(\d+)/g)];
  if(!ms.length) return null;
  const u=Number(ms[ms.length-1][1]), l=Number(ms[ms.length-1][2]);
  if(!u||u>999) return null;
  return {upc:u,litros:l};
}
// renglón de YPF: codigo, descripcion, cantidad, UM, riesgo, valor unitario, importe
const RE_YPF=/^(\d{5,7})\s+(.+?)\s+(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z]{2,3})\s+(\d+)\s+([\d.]+,\d{2,3})\s+([\d.]+,\d{2})\s*$/;
// a veces el código y la descripción abren el renglón y los números caen abajo
const RE_YPF_CAB=/^(\d{5,7})\s+([A-Za-zÁÉÍÓÚÑ][^\d]{3,})\s*$/;
const RE_YPF_COLA=/^(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z]{2,3})\s+(\d+)\s+([\d.]+,\d{2,3})\s+([\d.]+,\d{2})\s*$/;
function renglonesYPF(lineas){
  const out=[]; let pend=null;
  const corta=/^(CODIGO|OBSERVACIONES|NRO\.RIESGO|IBP|IMPORTE|TOTAL|SON:|Remito|IVA |FINANCIACION|ICL|IDC|Producido|Precios|PAGOS|Cotizaci|IMPRENTA|CUIT|FECHA|HORA|CONTROLM|CAE|Recib|Es responsab|DOCUMENTO|Firma|HOJA|SRES|DOMICILIO|ENTREGA|VICENTE|P\. PAGO|TRANSPORTISTA|CP\/|PRECINTOS|CONDUCTOR|PATENTE|CAPACIDAD|PESO|OC:|N° |CUENTA|INCOTERMS|FORMA|BV\.|CABA|YPF|Calidad|ORIGINAL|A$)/i;
  const cerrar=()=>{ if(pend&&pend.listo){ out.push(pend); } pend=null; };
  for(const l0 of lineas){
    const l=l0.replace(/\s+/g,' ').trim();
    if(!l) continue;
    let m=l.match(RE_YPF);
    if(m){
      cerrar();
      pend={cod:m[1],desc:m[2].trim(),cajas:numeroSig(m[3]),um:m[4],
            vu:numeroSig(m[6]),imp:numeroSig(m[7]),linea:l,listo:true};
      continue;
    }
    m=l.match(RE_YPF_CAB);
    if(m&&!corta.test(l)){ cerrar(); pend={cod:m[1],desc:m[2].trim(),listo:false}; continue; }
    if(pend&&!pend.listo){
      m=l.match(RE_YPF_COLA);
      if(m){ pend.cajas=numeroSig(m[1]); pend.um=m[2]; pend.vu=numeroSig(m[4]);
             pend.imp=numeroSig(m[5]); pend.linea=l; pend.listo=true; continue; }
    }
    // continuación de la descripción: se pega al renglón abierto
    if(pend&&!corta.test(l)&&/[A-Za-z0-9]{2,}/.test(l)&&!RE_YPF_COLA.test(l)&&l.length<70){
      pend.desc=(pend.desc+' '+l).replace(/\s+/g,' ').trim();
      continue;
    }
    if(corta.test(l)) { if(pend&&pend.listo){ out.push(pend); pend=null; } }
  }
  cerrar();
  // sin duplicados: la misma factura puede repetir encabezados por hoja
  const vistos=new Set();
  return out.filter(r=>{ const k=r.cod+'|'+r.imp; if(vistos.has(k)) return false; vistos.add(k); return true; });
}
async function armarYPF(renglones){
  const env=await envases();
  return renglones.map(r=>{
    const p=presentacion(r.desc);
    const upc=env[r.cod]||(p?p.upc:0);
    const origen=env[r.cod]?'guardado':(p?'descripción':'');
    const unidades=upc?r.cajas*upc:0;
    const pu=unidades?r.imp/unidades:0;
    return {...r,upc,origen,litros:p?p.litros:null,unidades,pu,barra:barraYPF(r.cod),
            cierra:unidades?Math.abs(unidades*pu-r.imp)<0.01:false};
  });
}

// pedido de la Extranet YPF: cada renglón trae el producto, la presentación y las cajas
const MAPA_PED=[
  [/AURO\s*PLUS/i,'Auro Plus'],[/AURO\s*FE/i,'Auro FE'],
  [/AURO\s*FR\s*530/i,'Auro FR 530'],[/AURO\s*FR\s*540/i,'Auro FR 540'],
  [/AURO\s*D1\s*530/i,'Auro D1 530'],[/AURO\s*D1\s*0?20/i,'Auro D1 020'],
  [/AURO\s*DPF/i,'Auro DPF'],[/AURO\s*D2/i,'Auro D2 30'],
  [/TS\s*10?40/i,'TS 10W40'],[/FS\s*530/i,'FS 530'],[/FS\s*540/i,'FS 540'],
  [/MI\s*15?40/i,'MI 15W-40'],[/MI\s*20?50/i,'MI 20W-50'],
];
const MAPA_PED_OTR=[
  [/KRIOX/i,'Kriox 1 LT'],[/LAVA\s*PARABRISAS/i,'Lavaparabrisas 1 LT'],
  [/HIDRO/i,'Hidro 1 LT'],
  [/FRENOS?.*DOT\s*4.*24\s*X\s*200/i,'Freno T4 200'],[/FRENOS?.*DOT\s*4.*12\s*X\s*1/i,'Freno T4 1 LT'],
  [/FRENOS?.*DOT\s*3.*24\s*X\s*200/i,'Freno T3 200'],[/FRENOS?.*DOT\s*3.*20\s*X\s*500/i,'Freno T3 500'],
  [/FRENOS?.*DOT\s*3.*12\s*X\s*1/i,'Freno T3 1 LT'],
  [/2T\s*60\s*X\s*100/i,'2T 100'],[/2T\s*40\s*X\s*200/i,'2T 200'],[/2T\s*12\s*X\s*1/i,'2T 1 LT'],
  [/R[ÖO]D\s*MOTO/i,'Röd Moto 1 LT'],
];
const RE_PED=/^(.+?)\s+(4\s*\/\s*4|12\s*\/\s*1)?\s*(?:L\s*)?CJ\s+(\d{1,4})\s+[\d.,]+\s*$/i;

function leerPedidoYPF(lineas){
  const ace={}, otr={}, sinMapa=[];
  let nro='', fecha='';
  for(const raw of lineas){
    const l=String(raw).replace(/\s+/g,' ').trim();
    if(!l) continue;
    const mn=l.match(/N[úu]mero de pedido\s*(\d+)/i); if(mn) nro=mn[1];
    const mf=l.match(/(\d{2}\/\d{2}\/\d{4})/); if(mf&&!fecha) fecha=mf[1];
    const m=l.match(RE_PED);
    if(!m) continue;
    const desc=m[1].trim(), pres=(m[2]||'').replace(/\s/g,''), cajas=Number(m[3])||0;
    if(!cajas) continue;
    const a=MAPA_PED.find(([re])=>re.test(desc));
    if(a){
      const k=a[1]; ace[k]=ace[k]||{c4:0,c1:0};
      if(pres==='12/1') ace[k].c1+=cajas; else ace[k].c4+=cajas;
      continue;
    }
    const o=MAPA_PED_OTR.find(([re])=>re.test(desc));
    if(o){ otr[o[1]]=(otr[o[1]]||0)+cajas; continue; }
    sinMapa.push({desc,cajas});
  }
  return {ace,otr,sinMapa,nro,fecha};
}

          <strong>${nf(S.pedPrevia.nAce)}</strong> renglones de aceite y <strong>${nf(S.pedPrevia.nOtr)}</strong> del resto ·

// hoja del pedido del mes, para imprimir y mandar
function hojaPedidoLub(){
  const d=S.lub; if(!d) return '';
  const mes=S.lubMes, m=d.meses[mes]||{ace:{},otr:{}};
  const t=litrosTrim(d), L=t.por[mes]||{premium:0,otros:0,total:0,c4:0,c1:0,cajasOtr:0};
  const objP=Number(d.obj.premium)||0, objT=Number(d.obj.total)||0;

  const fAce=listaAce().map(p=>{
    const a=(m.ace||{})[p]||{}, c4=Number(a.c4)||0, c1=Number(a.c1)||0;
    if(!c4&&!c1) return '';
    return `<tr><td>${esc(p)}</td><td class="num">${c4||'—'}</td><td class="num">${c1||'—'}</td>
      <td class="num">${nf(c4*LTS_C4+c1*LTS_C1)}</td></tr>`;
  }).filter(Boolean).join('');
  let ltsOtrTodo=0;
  const fOtr=listaOtr().map(o=>{
    const c=Number((m.otr||{})[o.n])||0;
    if(!c) return '';
    const l=c*ltsOtro(o); ltsOtrTodo+=l;
    return `<tr><td>${esc(o.n)}</td><td class="num">${c}</td><td class="num">${o.u} × ${o.cc} cc</td>
      <td class="num">${nf(l,1)}</td></tr>`;
  }).filter(Boolean).join('');

  const faltaP=Math.max(0,objP-t.premium), faltaT=Math.max(0,objT-t.total);
  return `<div class="hoja-lub">
    <h1>Pedido de lubricante</h1>
    <p>${esc(S.cfg.estacion)} · ${MESES_L[Number(mes)-1]} ${d.anio} · ${ROMANO[d.trim-1]} trimestre
       · emitido el ${hoyISO().split('-').reverse().join('/')}</p>
    ${fAce?`<h2>Aceite de motor</h2>
      <table><thead><tr><th>Producto</th><th>Cajas 4 L</th><th>Cajas 1 L</th><th>Litros</th></tr></thead>
      <tbody>${fAce}</tbody>
      <tfoot><tr><td>Total aceite</td><td>${nf(L.c4)}</td><td>${nf(L.c1)}</td><td>${nf(L.premium)}</td></tr></tfoot>
      </table>`:''}
    ${fOtr?`<h2>Resto de la línea</h2>
      <table><thead><tr><th>Producto</th><th>Cajas</th><th>Presentación</th><th>Litros</th></tr></thead>
      <tbody>${fOtr}</tbody>
      <tfoot><tr><td>Total resto</td><td>${nf(L.cajasOtr)}</td><td></td><td>${nf(ltsOtrTodo,1)}</td></tr></tfoot>
      </table>`:''}
    ${(!fAce&&!fOtr)?`<p>No hay nada cargado en ${MESES_L[Number(mes)-1]}.</p>`:''}
    <h2>Cómo venimos en el trimestre</h2>
    <table>
      <thead><tr><th>Concepto</th><th>Objetivo</th><th>Comprado</th><th>Falta</th></tr></thead>
      <tbody>
        <tr><td>Aceite de motor (premium)</td><td>${objP?nf(objP):'—'}</td>
          <td>${nf(t.premium)}</td>
          <td>${objP?(faltaP?nf(faltaP)+' L':'cumplido'):'—'}</td></tr>
        <tr><td>Total lubricante</td><td>${objT?nf(objT):'—'}</td>
          <td>${nf(t.total)}</td>
          <td>${objT?(faltaT?nf(faltaT)+' L':'cumplido'):'—'}</td></tr>
      </tbody>
    </table>
    <p class="pie">Este mes suma ${nf(L.premium+ltsOtrTodo,1)} litros pedidos${L.otros!==ltsOtrTodo?` (${nf(L.premium+L.otros,1)} cuentan para el objetivo)`:''}. Los litros salen de las cajas: una de 4 L son ${LTS_C4} litros y una de 1 L son ${LTS_C1}.</p>
  </div>`;
}

function cuerpoLub(){
  const d=S.lub; if(!d) return '';
  const meses=TRIM[d.trim-1], t=litrosTrim(d), mes=S.lubMes, m=d.meses[mes], L=t.por[mes];
  const objP=Number(d.obj.premium)||0, objT=Number(d.obj.total)||0, objC=Number(d.obj.crm)||0;
  const pct=(v,o)=>o?v/o*100:0;
  const barra=(v,o,rot)=>{
    const p=Math.min(100,pct(v,o));
    return `<div class="meta" style="margin-bottom:11px">
      <div class="mrot"><span>${rot}</span><span class="mpc ${p>=100?'ok':''}">${o?nf(pct(v,o),1)+'%':'—'}</span></div>
      <div class="mtrack"><i style="width:${p}%;background:${p>=100?'var(--ok)':'var(--cian)'}"></i></div>
      <div class="mpie">${nf(v)} de ${o?nf(o):'—'} litros${o&&v<o?` · faltan ${nf(o-v)}`:''}</div></div>`;
  };

  const filasAce=listaAce().map(p=>{
    const it=m.ace[p]||{}, c4=Number(it.c4)||0, c1=Number(it.c1)||0;
    const lts=c4*LTS_C4+c1*LTS_C1;

const TIPOS_COMBO=[
  {id:'comida',nombre:'Combo comida',color:'#FF6B85',rubros:['241','198']},
  {id:'cafe',  nombre:'Combo cafetería',color:'#22E3F5',rubros:['232']}

// el reporte acumula desde el inicio del trimestre: se guarda cada corte y el día sale por diferencia
async function cortesCombos(){
  if(!S.cortes) S.cortes=await leer('tienda:combos-cortes',{});
  return S.cortes;
}
function leerReporteCombos(filas,nombreArch){
  const texto=(r,i)=>String((r||[])[i]??'').trim();
  const fFecha=filas.findIndex(r=>norm(texto(r,0)).indexOf('FECHA')===0);
  if(fFecha<0) return {error:`En “${nombreArch}” no encontré la fila de fechas.`};
  const fecha=s=>{ const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m?`${m[3]}-${m[2]}-${m[1]}`:''; };
  const desde=fecha(texto(filas[fFecha],1)), hasta=fecha(texto(filas[fFecha],2));
  if(!desde||!hasta) return {error:`En “${nombreArch}” no pude leer el período.`};

  const fRubro=filas.findIndex(r=>norm(texto(r,0))==='RUBRO:');
  const rubro=fRubro>=0?texto(filas[fRubro],1).replace(/\D/g,''):'';

  // suma todas las filas cuyo Detalle (columna C) diga TOTAL COMBO
  let combos=0, filasCombo=0;
  for(const r of filas){
    if(norm(texto(r,2))!=='TOTAL COMBO') continue;
    const q=numeroSig(texto(r,3));
    if(q){ combos+=q; filasCombo++; }
  }
  // y de paso cada producto con sus unidades, para el ranking del mes
  const prod={};
  let grupo='', empezo=false;
  for(const r of filas){
    if(!empezo){                                              // saltear el encabezado del reporte
      if(norm(texto(r,2))==='DETALLE'||norm(texto(r,1))==='CODIGO') empezo=true;
      continue;
    }
    const c0=texto(r,0), c1=texto(r,1), det=texto(r,2), c3=texto(r,3);
    // encabezado de grupo: trae texto en la primera columna y no trae cantidad
    if(c0&&det&&!c1&&!c3){ grupo=det; continue; }
    if(!c1||!det) continue;                                   // los productos vienen con código
    if(norm(det).startsWith('TOTAL')) continue;
    const q=numeroSig(c3);
    if(!q) continue;
    const esC=/-\s*COMBO\s*$/i.test(grupo);
    const k=(esC?'C|':'S|')+det.slice(0,60);                  // el mismo producto suelto y en combo van aparte
    if(!prod[k]) prod[k]={n:det.slice(0,60),g:grupo.replace(/\s*-\s*(COMBO|RECIPE|ITEM)\s*$/i,'').trim(),
                          combo:esC,q:0};
    prod[k].q+=q;
  }
  const tipo=(TIPOS_COMBO.find(t=>t.rubros.includes(rubro))||{}).id||'';
  if(!tipo) return {error:`En “${nombreArch}” el rubro es ${rubro||'desconocido'} y no sé si es comida o cafetería.`};
  return {desde,hasta,rubro,tipo,combos:Math.round(combos),filasCombo,prod,arch:nombreArch};
}

// ranking de productos del mes: lo de cada corte menos el anterior del mismo período
function rankingMes(cortes,ym){
  const porPeriodo={};
  Object.values(cortes).forEach(c=>{ (porPeriodo[c.desde]=porPeriodo[c.desde]||[]).push(c); });
  const acum={};
  Object.values(porPeriodo).forEach(lista=>{
    lista.sort((a,b)=>a.hasta.localeCompare(b.hasta));
    let prev={};
    lista.forEach(c=>{
      const p=c.prod||{};
      if(c.hasta.slice(0,7)===ym){
        Object.entries(p).forEach(([k,x])=>{
          const antes=(prev[k]||{}).q||0;
          const d=x.q-antes;
          if(d<=0) return;
          if(!acum[k]) acum[k]={n:x.n,g:x.g,combo:x.combo,q:0};
          acum[k].q+=d;
        });
      }
      prev=p;
    });
  });
  return Object.values(acum).sort((a,b)=>b.q-a.q);
}

// arma la serie diaria a partir de los cortes de un mismo período
function combosPorDia(cortes){
  const porPeriodo={};
  Object.values(cortes).forEach(c=>{ (porPeriodo[c.desde]=porPeriodo[c.desde]||[]).push(c); });
  const dias={};
  Object.values(porPeriodo).forEach(lista=>{
    lista.sort((a,b)=>a.hasta.localeCompare(b.hasta));
    let prev={comida:0,cafe:0};
    lista.forEach((c,i)=>{
      const d={comida:(c.comida||0)-prev.comida, cafe:(c.cafe||0)-prev.cafe};
      dias[c.hasta]={...d, acumulado:{comida:c.comida||0,cafe:c.cafe||0},
        primero:i===0, desde:c.desde,
        raro:(d.comida<0||d.cafe<0)};
      prev={comida:c.comida||0,cafe:c.cafe||0};
    });
  });
  return dias;
}

// texto del PDF agrupado por renglón, según la coordenada vertical
async function textoPDF(f){
  const lib=await cargarPdfJs();
  const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;
  const lineas=[];
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n), tc=await pg.getTextContent();
    const filas={};
    tc.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      (filas[y]=filas[y]||[]).push({x:it.transform[4],s:it.str});
    });
    Object.keys(filas).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const t=filas[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim();
      if(t) lineas.push(t);
    });
  }
  return lineas;
}
// formato Renova: "1.00 PH3569 Descripción C14 21.00 8,943.89 22.40 6,940.46 6,940.46"
// un renglón solo vale si termina con la cola de importes; si no, es encabezado o pie.
const RE_ITEM=/^(\d{1,4}(?:[.,]\d{1,3})?)\s+([A-Z0-9][A-Z0-9\-\/\.]{2,})\s+(.*)$/i;
const RE_CIERRE=/((?:[A-Z]{1,3}\d{0,3}\s+)?\d{1,3}[.,]\d{2}\s+)?[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s*$/;
// la cola real: al menos cuatro importes seguidos, el último con dos decimales
const RE_COLA_OK=/(?:[\d.,]+\s+){3,}[\d.,]*\d[.,]\d{2}\s*$/;
function renglonesFactura(lineas){
  const out=[];
  const corta=/^(TOTAL|SUBTOTAL|IVA|NETO|CUIT|CAE|HOJA|SON PESOS|OBSERVACIONES|ORIGINAL|No se aceptan|Cantidad\s+Codigo|Cond\.|Remito|Vendedor|Cliente|Domicilio)/i;
  for(const l0 of lineas){
    const l=l0.replace(/\s+/g,' ').trim();
    if(!l||corta.test(l)) continue;
    if(/Cond\.:|%Dto\.|Vencimiento CAE|Fecha Vencimiento/i.test(l)) continue;
    const m=l.match(RE_ITEM);
    if(!m){
      // renglón de continuación: se pega a la descripción del anterior
      const sinEsp=l.replace(/\s/g,'');
      const esHash=sinEsp.length>=20&&/^[0-9A-F]+$/i.test(sinEsp.slice(0,20));
      const tieneLetras=/[A-Za-zÁÉÍÓÚÑáéíóúñ]{2,}/.test(l);
      if(out.length&&tieneLetras&&!esHash&&!/^[\d.,\s]+$/.test(l)&&l.length>2&&!/\d[.,]\d{2}\s+[\d.,]+\s*$/.test(l))
        out[out.length-1].desc=(out[out.length-1].desc+' '+l).replace(/\s+/g,' ').trim();
      continue;
    }
    // sin la cola de importes no es un producto: es la condición de pago o el pie
    if(!RE_COLA_OK.test(l)) continue;
    const cant=Math.max(1,Math.round(numero(m[1])));
    const cod=m[2].toUpperCase();
    let desc=m[3].replace(RE_CIERRE,'').trim();
    // a veces el código vuelve a aparecer al principio de la descripción
    const rep=new RegExp('^'+cod.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[\\s\\-]*','i');
    desc=desc.replace(rep,'').trim();
    if(!desc) desc=cod;
    out.push({cod,desc,cant,linea:l});
  }
  // limpieza final: la descripción no debe repetir el código, ni al principio ni suelto
  return out.map(r=>{
    const c=r.cod.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    let d=String(r.desc||'')
      .replace(new RegExp('\\b'+c+'\\b','ig'),' ')     // el código en cualquier parte
      .replace(/\s+/g,' ').replace(/^[\s\-–·.]+/,'').trim();
    return {...r,desc:d||r.cod};
  });
}

function trimPorDefecto(claves,anio){

// suma de los objetivos del trimestre
function objTrim(o,anio,meses,met){
  const s=meses.reduce((a,m)=>({min:a.min+objV(o,`${anio}-${m}`,met,'min'),
                                max:a.max+objV(o,`${anio}-${m}`,met,'max')}),{min:0,max:0});
  if(s.max&&s.max<s.min) s.max=s.min;   // algún mes quedó sin máximo cargado
  return s;
}
// promedio de los meses cargados, para el mix que es porcentaje
function objProm(o,anio,meses,met){
  const c=meses.map(m=>({min:objV(o,`${anio}-${m}`,met,'min'),max:objV(o,`${anio}-${m}`,met,'max')}))
               .filter(x=>x.min||x.max);
  if(!c.length) return {min:0,max:0};
  return {min:c.reduce((a,x)=>a+x.min,0)/c.length, max:c.reduce((a,x)=>a+x.max,0)/c.length};
}
// el objetivo que llega ya viene acumulado del trimestre: vale el del último mes cargado
function objVigente(o,anio,meses,met){
  let mes=null;
  meses.forEach(m=>{ if(objV(o,`${anio}-${m}`,met,'min')||objV(o,`${anio}-${m}`,met,'max')) mes=m; });
  if(!mes) return {mes:null,min:0,max:0,cubre:[]};
  return {mes,min:objV(o,`${anio}-${mes}`,met,'min'),max:objV(o,`${anio}-${mes}`,met,'max'),
          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}
// 0% si no llega al mínimo, 100% si pasa el máximo, proporcional en el medio
function cumpl(real,min,max){
  if(!min&&!max) return null;
  if(!max||max<=min) return real>=min?100:0;
  if(real<min) return 0;
  if(real>=max) return 100;
  return (real-min)/(max-min)*100;
}
function barraMeta(real,min,max,uni){

  const falta=real<min?min-real:(max&&real<max?max-real:0);
  const meta=real<min?'mínimo':'máximo';

    <div class="mtrack">

  </div>`;
}

async function leerPlanillas(archivos){
  if(typeof XLSX==='undefined') return {error:'No se pudo cargar el lector de Excel. Revisá la conexión y recargá.'};
  const res={filas:0,saltadas:0,meses:{},desconocidas:[]};
  const desc=new Set();
  for(const f of archivos){
    let wb;
    try{ wb=XLSX.read(await f.arrayBuffer(),{type:'array'}); }
    catch(e){ return {error:`“${f.name}” no se pudo abrir como Excel.`}; }
    const filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});
    const iCab=filas.findIndex(r=>r.some(c=>String(c||'').trim().toLowerCase().startsWith('fecha')));
    if(iCab<0) return {error:`En “${f.name}” no encontré la fila de encabezado con “Fecha Apertura”.`};
    const cab=filas[iCab].map(c=>String(c||'').trim().toUpperCase());
    const cols={};
    cab.forEach((nom,i)=>{
      if(!nom||i===0||nom.startsWith('TOTAL')) return;
      const pid=Object.keys(ALIAS).find(k=>ALIAS[k].includes(nom));
      if(pid) cols[i]=pid; else desc.add(cab[i]);
    });
    for(const r of filas.slice(iCab+1)){
      const m=String(r[0]||'').trim().match(/(\d{2})\/(\d{2})\/(\d{4})\s*\((\d)\)/);
      if(!m){ if(String(r[0]||'').trim()) res.saltadas++; continue; }
      const [,dia,mm,aa,turno]=m, ym=`${aa}-${mm}`;
      if(!res.meses[ym]) res.meses[ym]={dias:{},total:0,existe:false};
      const prod={};
      for(const [i,pid] of Object.entries(cols)){
        const v=Number(r[i])||0;
        if(v>0){ prod[pid]=Math.round(v*100)/100; res.meses[ym].total+=v; }
      }
      res.meses[ym].dias[dia]=res.meses[ym].dias[dia]||{};
      res.meses[ym].dias[dia]['T'+turno]={prod,ts:Date.now()};
      res.filas++;
    }
  }
  for(const ym of Object.keys(res.meses)){
    res.meses[ym].total=Math.round(res.meses[ym].total*100)/100;
    res.meses[ym].existe=Object.keys(await ops('playa',ym)).length>0;
  }
  res.desconocidas=[...desc];
  if(!res.filas) return {error:'No encontré filas con fecha y turno, como “Wed 01/01/2026 (1)”.'};
  return res;
}

const objTNorm=(o,ym)=>{const x=o[ym]||{};const g=k=>({min:(x[k]&&x[k].min!=null)?x[k].min:'',max:(x[k]&&x[k].max!=null)?x[k].max:''});
  const r={}; METS_TIENDA().forEach(m=>r[m.k]=g(m.k)); return r;};
const objTV=(o,ym,k,q)=>Number(((o[ym]||{})[k]||{})[q])||0;
function objTVigente(o,anio,meses,k){
  let mes=null;
  meses.forEach(m=>{ if(objTV(o,`${anio}-${m}`,k,'min')||objTV(o,`${anio}-${m}`,k,'max')) mes=m; });
  if(!mes) return {mes:null,min:0,max:0,cubre:[]};
  return {mes,min:objTV(o,`${anio}-${mes}`,k,'min'),max:objTV(o,`${anio}-${mes}`,k,'max'),
          cubre:meses.slice(0,meses.indexOf(mes)+1)};
}
const realTienda=(r,anio,meses,k,C)=>(meses||[]).reduce((a,m)=>{
  if(k==='combos') return a+(Number((C||{})[`${anio}-${m}`])||0);
  const x=r[`${anio}-${m}`]; if(!x) return a;
  if(k==='tickets') return a+(x.tickets||0);
  if(k==='unidades'){                      // total de rubros menos el tabaco
    const tab=RUBROS_TABACO.reduce((s,c)=>s+((x.porProd||{})[c]||0),0);
    return a+((x.total||0)-tab);
  }
  return a+((x.porProd||{})[k]||0);
},0);

// unidades y pesos que cuentan para YPF: solo los rubros 02-, sin cigarrillos ni otros tabacos
const RUBRO_CUENTA=c=>String(c).startsWith('02-')&&!RUBROS_TABACO.includes(c);
function sinTabaco(mapa){
  let dentro=0, tabaco=0, fuera=0;
  Object.entries(mapa||{}).forEach(([c,v])=>{
    const n=Number(v)||0;
    if(RUBRO_CUENTA(c)) dentro+=n;
    else if(RUBROS_TABACO.includes(c)) tabaco+=n;
    else fuera+=n;
  });
  return {dentro,tabaco,fuera,total:dentro+tabaco+fuera};
}

// lee el consolidado del mes: un solo archivo con el resumen por rubros de todo el período
function leerMesTienda(texto,nombreArch){
  const plano=String(texto).replace(/<[^>]+>/g,'\n').replace(/&nbsp;/g,' ');
  const lineas=plano.split('\n').map(l=>l.trim()).filter(Boolean);
  const rubro={}, importe={};
  const RE=/^(\d{2}-\d{3})\s+(.+?)\s+(-?[\d.]+,\d+)\s+(-?[\d.]+,\d{2})$/;
  lineas.forEach(l=>{
    const m=l.match(RE); if(!m) return;
    const cod=m[1], cant=numeroSig(m[3]), imp=numeroSig(m[4]);
    if(cant) rubro[cod]=(rubro[cod]||0)+cant;
    if(imp) importe[cod]=(importe[cod]||0)+imp;
  });
  if(!Object.keys(rubro).length) return {error:`En “${nombreArch}” no encontré el resumen por rubros.`};
  const fechas=[...plano.matchAll(/(\d{2})\/(\d{2})\/(\d{4})/g)].map(m=>`${m[3]}-${m[2]}-${m[1]}`).sort();
  const rango=plano.match(/CIERRE DE CAJA NRO:\s*(\d+)\s*al\s*(\d+)/i);
  const tk=plano.match(/FACTURAS?\s*\([A-Z]\)\s*:?\s*PRIM:?\s*(\d+)\s*ULT:?\s*(\d+)/i);
  return {rubro,importe,
    desde:fechas[0]||'', hasta:fechas[fechas.length-1]||'',
    ym:(fechas[0]||'').slice(0,7),
    cierres:rango?`${rango[1]} al ${rango[2]}`:'',
    tickets:tk?Math.max(0,Number(tk[2])-Number(tk[1])+1):0, arch:nombreArch};
}
// el mes sale de los cierres diarios; si no hay, del consolidado cargado a mano
async function ventasMesTienda(ym){
  const ops=await leer(`ops:tienda:${ym}`,{});
  const imp=await admin('tienda-importes',{});
  let u=0,i=0,tab=0,fue=0,tk=0,turnos=0;
  Object.values(ops).forEach(dia=>Object.values(dia||{}).forEach(t=>{
    const s=sinTabaco(t&&t.rubro); u+=s.dentro; tab+=s.tabaco; fue+=s.fuera;
    tk+=Number(t&&t.tickets)||0; turnos++;
  }));
  Object.entries(imp).forEach(([f,v])=>{ if(!f.startsWith(ym+'-')) return;
    Object.values(v||{}).forEach(t=>{ i+=sinTabaco(t&&t.porRubro).dentro; }); });
  if(turnos) return {unidades:u,importe:i,tabaco:tab,fuera:fue,tickets:tk,turnos,fuente:'diarios'};
  const m=await leer(`tienda:mes:${ym}`,null);
  if(m){ const s=sinTabaco(m.rubro), p=sinTabaco(m.importe);
    return {unidades:s.dentro,importe:p.dentro,tabaco:s.tabaco,fuera:s.fuera,
            tickets:m.tickets||0,turnos:0,fuente:'mes',cierres:m.cierres||'',arch:m.arch||''}; }
  return {unidades:0,importe:0,tabaco:0,fuera:0,tickets:0,turnos:0,fuente:'vacio'};
}

      const u=sinTabaco(o?o.rubro:{}), p=sinTabaco(im?im.porRubro:{});

      <span class="nom">Unidades</span><span class="guia"></span><span class="val">${nf(vm.unidades)}<i>u</i></span></div>
    <div class="linea-totem"><span class="chip" style="background:#3DE0A0"></span>
      <span class="nom">Importe</span><span class="guia"></span><span class="val">${nf(vm.importe)}<i>$</i></span></div>
    <div class="totem-total"><span class="nom">${vm.fuente==='mes'?'Del mes completo':vm.fuente==='diarios'?vm.turnos+' turnos cargados':'Sin datos'}</span>

  <div class="tarjeta">

    <input type="file" id="vt-arch" accept=".htm,.html">
    ${S.vtPrevia?(S.vtPrevia.error
      ? `<div class="aviso mal" style="margin-top:11px">${esc(S.vtPrevia.error)}</div>`
      : (()=>{const s=sinTabaco(S.vtPrevia.rubro), p=sinTabaco(S.vtPrevia.importe);
          return `<div class="aviso bien" style="margin-top:11px">
            Leí del <strong>${S.vtPrevia.desde.split('-').reverse().join('/')}</strong> al
            <strong>${S.vtPrevia.hasta.split('-').reverse().join('/')}</strong>${S.vtPrevia.cierres?` · cajas ${esc(S.vtPrevia.cierres)}`:''}.
            <br>Unidades sin tabaco: <strong>${nf(s.dentro)}</strong> · importe <strong>${nf(p.dentro)}</strong>
            · tabaco ${nf(s.tabaco)} · residual ${nf(s.fuera)}.</div>
          <button class="btn" id="vt-guardar">Guardar como ${MESES_L[Number(S.vtPrevia.ym.slice(5,7))-1]} ${S.vtPrevia.ym.slice(0,4)}</button>`;})()
      ):''}
    ${vm&&vm.fuente==='mes'?`<div class="aviso" style="margin-top:11px">Cargado el mes completo${vm.cierres?` · cajas ${esc(vm.cierres)}`:''}. 
      <button class="btn sec chico" id="vt-borrar-mes" style="width:auto;margin:7px 0 0">Borrar el mes completo</button></div>`:''}

// comisión del Programa +YPF: los litros de Infinia por su precio, por el porcentaje que corresponde
async function bloqueComision(v,obtenidos,posibles){
  const anio=S.libreAnio, trim=S.libreTrim;
  const C=await cargarComision(anio,trim), ed=S.comiEdit;
  const cumpl = posibles? obtenidos/posibles*100 : 0;
  const tope=(COMIS_YPF[C.zona||'A']||COMIS_YPF.A)[C.imagen||'ni2020']||{g2:0,g3:0};
  const pctG2=tope.g2*cumpl/100, pctG3=tope.g3*cumpl/100;
  const pInf=Number(C.pvpInf)||0, pInd=Number(C.pvpInd)||0;
  const monto = v.inf*pInf*tope.g3/100*(cumpl/100) + v.ind*pInd*tope.g3/100*(cumpl/100);
  const campo=(k,ph)=>ed
    ? `<input type="text" inputmode="decimal" class="n" data-comi="${k}" value="${C[k]??''}" placeholder="${ph}" style="width:96px">`
    : (Number(C[k])?nf(Number(C[k]),2):'—');

  return `<details class="lb-plega"${S.comiAbierta?' open':''} id="lb-comi">
    <summary><span class="lb-flecha">▸</span><strong>Carga automatizada</strong>
      <small>${S.libreOk?`${nf(cumpl,0)}% de cumplimiento · ${monto?nf(monto):'sin precios cargados'}`:'🔒 pide clave'}</small></summary>
    <div style="padding:0 13px 13px">
      <div class="lb-trim" style="margin-bottom:9px">
        <span class="et">Zona</span>
        ${ed?`<select id="comi-zona">${['A','B'].map(z=>`<option value="${z}"${(C.zona||'A')===z?' selected':''}>Zona ${z}</option>`).join('')}</select>
             <select id="comi-imagen">${IMAGENES.map(([k,r])=>`<option value="${k}"${(C.imagen||'ni2020')===k?' selected':''}>${r}</option>`).join('')}</select>`
          :`<strong>Zona ${esc(C.zona||'A')} · ${esc((IMAGENES.find(x=>x[0]===(C.imagen||'ni2020'))||[,''])[1])}</strong>`}
        <button class="lapiz-min${ed?' act':''}" id="comi-editar" style="margin-left:auto"
          title="${ed?'Listo':'Modificar · pide clave'}">${ed?'✓':'✎'}</button>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Grado</th><th class="num">Tope</th><th class="num">Con ${nf(cumpl,0)}% cumplido</th>
          <th class="num">Litros del trimestre</th><th class="num">PVP</th><th class="num">Monto</th></tr></thead>
        <tbody>
          <tr><td>Grado 3 · Infinia nafta</td><td class="num">${nf(tope.g3,1)} %</td>
            <td class="num"><strong>${nf(pctG3,2)} %</strong></td>
            <td class="num">${nf(v.inf)}</td><td class="num">${campo('pvpInf','precio')}</td>
            <td class="num"><strong>${nf(v.inf*pInf*tope.g3/100*(cumpl/100))}</strong></td></tr>
          <tr><td>Grado 3 · Infinia diesel</td><td class="num">${nf(tope.g3,1)} %</td>
            <td class="num"><strong>${nf(pctG3,2)} %</strong></td>
            <td class="num">${nf(v.ind)}</td><td class="num">${campo('pvpInd','precio')}</td>
            <td class="num"><strong>${nf(v.ind*pInd*tope.g3/100*(cumpl/100))}</strong></td></tr>
          <tr style="opacity:.6"><td>Grado 2 · Súper y Diesel 500</td><td class="num">${nf(tope.g2,1)} %</td>
            <td class="num"><strong>${nf(pctG2,2)} %</strong></td>
            <td class="num">${nf(v.naftas-v.inf+v.diesel-v.ind)}</td><td class="num">—</td>
            <td class="num">no entra en la fórmula</td></tr>
        </tbody>
        <tfoot><tr class="tot"><td colspan="5">Comisión del trimestre</td>
          <td class="num"><strong>${nf(monto)}</strong></td></tr></tfoot>
      </table></div>
      <p class="sub">Sale de los litros de Infinia por su precio, por el <strong>tope</strong> de tu zona e imagen, por el cumplimiento. La carta informa ${nf(pctG3,2)}% para grado 3, que es ese tope ya multiplicado por el cumplimiento: por eso acá se aplica una sola vez. El grado 2 se informa pero la fórmula de YPF no lo incluye.</p>
    </div>
  </details>`;
}

async function vistaLibre(){
  const d=await cargarLibre(), ed=S.libreEdit;
  const v=await ventasLibre(S.libreAnio,S.libreTrim,S.libreMes);
  const nfd=(v,dec)=>v===''||v===null||v===undefined?'—':nf(Number(v),dec);
  let posibles=0, obtenidos=0;
  const filas=d.filas.map((f,i)=>{
    const p=pctYPF(f.real,f.min,f.max);
    const pts=(Number(f.pts)||0)*p/100;
    posibles+=Number(f.pts)||0; obtenidos+=pts;
    // los decimales salen del propio número, como los manda YPF
    const decDe=v=>{ const s=String(v??''); const i=s.indexOf('.'); return i<0?0:Math.min(2,s.length-i-1); };
    const dec=Math.max(decDe(f.min),decDe(f.max),decDe(f.real));
    const cel=(k,ancho)=>ed
      ? `<input type="text" inputmode="decimal" class="lb-in" data-lb="${i}" data-k="${k}"
           value="${f[k]===''||f[k]===null||f[k]===undefined?'':String(f[k]).replace('.',',')}" style="width:${ancho}px">`
      // los m3 se muestran en litros; los números grandes van redondos
      : (()=>{ const v=f[k];
          if(v===''||v===null||v===undefined) return '—';
          if(esVolumen(f)) return nf(Number(v),0);
          return `${nfd(v,Math.abs(Number(v))>=1000?0:Math.max(dec,decDe(v)))}${f.uni==='%'?' %':''}`;
        })();
    return `<tr>

        <div class="ypf-rot">${esc(d.rotulo)}<br><small style="font-size:12px;letter-spacing:.04em;opacity:.85">${MESES_L[Number(S.libreMes)-1]} ${S.libreAnio} · ${ROMANO[S.libreTrim-1]} trimestre</small></div>

// el objetivo del mes solo, cuando lo que está cargado es acumulado del trimestre
function mesDeAcum(o,anio,mes,k){
  const meses=TRIM[trimDe(mes)-1];
  let pMin=0,pMax=0,r={min:0,max:0};
  for(const m of meses){
    const v=(o[`${anio}-${m}`]||{})[k]||{};
    const mi=Number(v.min)||0, ma=Number(v.max)||0;
    if(m===mes){ r=(mi||ma)?{min:mi-pMin,max:ma-pMax}:{min:0,max:0}; break; }
    if(mi||ma){ pMin=mi; pMax=ma; }
  }
  return r;
}

async function cargarPlata(anio,mes){
  const k=`plata:${anio}-${mes}`;
  if(S.plata&&S.plataClave===k) return S.plata;
  let d=await leer(k,null);
  if(!d){
    const m=Number(mes), pa=m>1?anio:String(Number(anio)-1), pm=String(m>1?m-1:12).padStart(2,'0');
    const p=await leer(`plata:${pa}-${pm}`,null);
    // tope de $200.000 por persona, repartido como YPF pondera cada objetivo
    // tope de $200.000 por persona: 87.500 + 87.500 + 25.000
    d=p?JSON.parse(JSON.stringify(p)):{
      combustible:{min:41000,max:87500},
      mix:{min:41000,max:87500},
      unidades:{min:41000,max:87500},
      combos:{min:41000,max:87500},
      incognito:{min:18000,max:25000}
    };
  }
  S.plata=d; S.plataClave=k;
  return d;
}

// unidades de comida elaborada, envasada y cafetería del mes
const RUBROS_CC=['02-241','02-198','02-232'];
const dmy=t=>{ const f=new Date(t);
  return `${String(f.getDate()).padStart(2,'0')}/${String(f.getMonth()+1).padStart(2,'0')}/${f.getFullYear()}`; };
const maxTs=obj=>{ let t=0;
  Object.values(obj||{}).forEach(dia=>Object.values(dia||{}).forEach(x=>{
    const v=Number(x&&x.ts)||0; if(v>t) t=v; }));
  return t; };
// cuándo se cargó por última vez lo que alimenta cada fila
async function fechaFuente(concepto,ym){
  const c=norm(concepto);
  if(/DIESEL|NAFTA|MIX/.test(c)) return (t=>t?dmy(t):'')(maxTs(await leer(`ops:playa:${ym}`,{})));
  if(/UNIDADES/.test(c)){
    const t=maxTs(await leer(`ops:tienda:${ym}`,{}));
    if(t) return dmy(t);
    const m=await leer(`tienda:mes:${ym}`,null);
    return (m&&m.ts)?dmy(m.ts):'';
  }
  if(/COMBOS/.test(c)){
    const CO=await cortesCombos();
    let t=0;
    Object.values(CO).forEach(x=>{ if((x.hasta||'').slice(0,7)===ym){ const v=Number(x.ts)||0; if(v>t) t=v; } });
    return t?dmy(t):'';
  }
  return '';
}
async function ventaCafeComida(ym){
  const ops=await leer(`ops:tienda:${ym}`,{});
  let u=0, hay=false;
  Object.values(ops).forEach(dia=>Object.values(dia||{}).forEach(t=>{
    RUBROS_CC.forEach(r=>{ const v=Number((t&&t.rubro||{})[r])||0; if(v){ u+=v; hay=true; } });
  }));
  if(hay) return u;
  const m=await leer(`tienda:mes:${ym}`,null);
  if(m) return RUBROS_CC.reduce((a,r)=>a+(Number((m.rubro||{})[r])||0),0);
  return 0;
}

async function panelPlata(anio,mes,delMes,sec){
  if(!S.plataGente) S.plataGente=await leer('plata:personal',{playa:10,tienda:4});
  const gente=Math.max(1,Number(S.plataGente[sec])||1);
  const P=await cargarPlata(anio,mes), ed=S.plataEdit;
  const PREMIOS=PREMIOS_SEC[sec]||PREMIOS_SEC.playa;
  const ccMes=await ventaCafeComida(`${anio}-${mes}`);
  const tope=Number(P.tope)||200000;
  let total=0, topeMin=0, topeMax=0;
  const filas=PREMIOS.map(p=>{
    // se suman los objetivos y lo vendido de las partes que lo componen
    let mi=0,ma=0,re=0,falta=false;
    if(p.fuente==='ventacc'){ re=ccMes; }
    p.partes.forEach(re2=>{
      const k=Object.keys(delMes).find(x=>re2.test(x));
      const d=k?delMes[k]:null;
      if(!d||(!d.min&&!d.max)){ falta=true; return; }
      mi+=Number(d.min)||0; ma+=Number(d.max)||0;
      if(p.fuente!=='ventacc') re+=Number(d.real)||0;
    });
    if(p.objPropio){                        // YPF no lo mide: el objetivo se carga acá
      const o=P[p.id]||{};
      mi=Number(o.objMin)||0; ma=Number(o.objMax)||0; falta=!mi&&!ma;
    }
    if(p.minFijo!=null) mi=p.minFijo;      // el piso para cobrar puede ser distinto al de YPF
    if(p.maxFijo!=null) ma=p.maxFijo;
    const fmtP=x=>p.pct?nf(x,1)+' %':nf(x);
    const v=P[p.id]||{};
    const pMin=Number(v.min)||0, pMax=Number(v.max)||0;
    const nivel = (ma&&re>=ma)?'max' : (mi&&re>=mi)?'min' : 'no';
    // pasado el mínimo, el premio sube derecho hasta el máximo
    let cobra=0, avance=0;
    if(nivel==='max') cobra=pMax||pMin;
    else if(nivel==='min'){
      avance = (ma&&ma>mi) ? (re-mi)/(ma-mi) : 0;
      cobra = Math.round(pMin + ((pMax||pMin)-pMin)*avance);
    }
    total+=cobra;
    topeMin+=pMin; topeMax+=pMax||pMin;
    const enPct=S.plataModo==='%';
    const aPct=x=>tope?Math.round(Number(x)/tope*10000)/100:0;
    const cel=k=>ed
      ? `<input type="text" inputmode="decimal" class="n" data-plata="${p.id}" data-k="${k}"
           value="${v[k]===''||v[k]==null?'':(enPct?String(aPct(v[k])).replace('.',','):v[k])}"
           placeholder="0" style="width:84px">`
      : `<span>${Number(v[k])?(enPct?nf(aPct(v[k]),2)+' %':nf(Number(v[k]))):'—'}</span>`;
    return `<tr class="pl-${nivel}">
      <td><strong>${esc(p.rot)}</strong><small>${esc(p.sub)}</small>
        <span class="ob-chip ${nivel==='max'?'max':nivel==='min'?'min':'no'}" style="margin-top:4px">${
        falta?'SIN OBJETIVO':nivel==='max'?'MÁXIMO':nivel==='min'?'MÍNIMO':'NO LLEGA'}</span></td>
      <td class="num">${p.objPropio?cel('objMin'):(mi?fmtP(mi):'—')}</td>
      <td class="num">${p.objPropio?cel('objMax'):(ma?fmtP(ma):'—')}</td>
      <td class="num"><strong>${re?fmtP(re):'—'}</strong></td>
      <td class="num">${cel('min')}</td>
      <td class="num">${cel('max')}</td>
      <td class="num"><strong style="color:${cobra?'var(--ok)':'var(--tinta-suave)'}">${nf(cobra)}</strong>
        ${nivel==='min'&&avance?`<small>${nf(avance*100,0)}% del tramo</small>`:''}</td></tr>`;
  }).join('');

  return `<div class="plata-panel">
    <div class="eyebrow">Objetivos por plata · ${MESES_L[Number(mes)-1]} ${anio}
      <button class="lapiz-min${ed?' act':''}" id="pl-editar" style="float:right"
        title="${ed?'Listo':'Modificar los montos · pide clave'}" aria-label="Modificar montos">${ed?'✓':'✎'}</button>
      ${ed?`<span class="pl-modo" style="float:right;margin-right:9px">
        <button data-plmodo="$"${S.plataModo!=='%'?' class="act"':''}>$</button>
        <button data-plmodo="%"${S.plataModo==='%'?' class="act"':''}>%</button>
      </span>`:''}</div>
    ${ed?`<div class="filtro" style="margin-bottom:9px"><span class="et">Tope por persona</span>
      <input type="text" inputmode="numeric" class="n" id="pl-tope" value="${nf(tope)}" style="width:100px">
      <span class="sub" style="margin:0">${S.plataModo==='%'?'los porcentajes se calculan sobre este tope':'escribí los montos en pesos'}</span></div>`:''}
    <div class="scroll"><table>
      <thead><tr><th>Objetivo</th><th class="num">Mínimo</th><th class="num">Máximo</th><th class="num">Vendido</th>
        <th class="num">Paga al mín.</th><th class="num">Paga al máx.</th><th class="num">A cobrar</th></tr></thead>
      <tbody>${filas}</tbody>
      <tfoot><tr class="tot"><td colspan="4">Total a cobrar por persona</td>

        <div class="d">${nf(gente)} ${gente===1?'persona':'personas'} en ${sec==='tienda'?'Tienda Full':'Playa'}</div></div>
      <div class="linea-totem"><span class="chip" style="background:var(--cian)"></span>
        <span class="nom">Cobra cada uno</span><span class="guia"></span>
        <span class="val">${nf(total)}<i>$</i></span></div>
      <div class="totem-total"><span class="nom">Total a repartir</span>

    <p class="sub">Debajo del mínimo no cobra. Pasado el mínimo cobra ese monto y <strong>va subiendo derecho</strong> hasta el máximo: si vendió la mitad del camino entre los dos, cobra la mitad de la diferencia. Los montos se heredan del mes anterior.</p>
  </div>`;
}

async function vistaObjYPF(sec){
  sec=sec||'playa';
  const hoy=hoyISO();
  const ym=S.oyMes||hoy.slice(0,7), anio=ym.slice(0,4), mes=ym.slice(5,7);
  const hoja=await leer(claveLibre(anio,mes),null);

    let v=await leer(kOc,null);

    S.oyOcultos[sec]=v||[];
  }
  const ocultos=S.oyOcultos[sec];
  const oculto=c=>ocultos.includes(norm(c));
  const ed=S.oyEdit;
  const meses=TRIM[trimDe(mes)-1], i=meses.indexOf(mes);
  const previa=i>0?await leer(claveLibre(anio,meses[i-1]),null):null;

  const r=await roll('playa'), C=await combos(), L=await litrosLubri();
  const iN=idsFam('Naftas'), iD=idsFam('Diesel');
  const vt=await ventasMesTienda(ym);
  const nafta=vendFam(r,ym,iN), diesel=vendFam(r,ym,iD), inf=vendFam(r,ym,[ID_INFINIA]);
  const REAL=[
    {re:/diesel/i,      v:diesel},
    {re:/naftas/i,      v:nafta},
    {re:/mix/i,         v:nafta?inf/nafta*100:0},
    {re:/lubricante/i,  v:Number(L[ym])||0},
    {re:/unidades/i,    v:vt.unidades},
    {re:/combos/i,      v:Number(C[ym])||0},
  ];

  const anios=[...new Set(Object.keys(r).map(k=>k.slice(0,4)).concat(hoy.slice(0,4)))].sort();
  const barra=`<div class="lb-trim">
      <span class="et">Mes</span>
      <select id="oy-anio">${anios.map(a=>`<option value="${a}"${a===anio?' selected':''}>${a}</option>`).join('')}</select>
      <select id="oy-mes">${MESES_L.map((n,k)=>{const v=String(k+1).padStart(2,'0');
        return `<option value="${v}"${v===mes?' selected':''}>${n}</option>`;}).join('')}</select>
      ${sec==='playa'?`<span class="lb-vmes"><b>${MESES_L[Number(mes)-1]}</b>
        <i>Total</i> <u>${nf(nafta+diesel)} L</u>
        <i>Naftas</i> ${nf(nafta)} <i>Diesel</i> ${nf(diesel)}</span>`:''}
    </div>`;

  if(!hoja||!hoja.filas||!hoja.filas.length)
    return `<div class="envoltorio libre-ancho">
      <div class="aviso mal">Todavía no hay un cuadro de <strong>${MESES_L[Number(mes)-1]} ${anio}</strong>.
      Los objetivos salen de la pestaña <strong>Libre</strong>: entrá ahí, elegí ese mes y cargalos.</div>
      ${barra}</div>`;

  let pos=0, obt=0, sinObj=0;
  const delMes={};                       // lo del mes, para los objetivos por plata
  const fechas={};
  for(const f of hoja.filas) fechas[norm(f.c)]=await fechaFuente(f.c,ym);
  const cuerpo=hoja.filas.map(f=>{
    const oc=oculto(f.c);
    if(oc&&!ed) return '';
    const pct100=f.uni==='%';
    // no se acumulan: los porcentajes y el lubricante, que va igual todo el trimestre
    const noAcum=pct100||/lubricante/i.test(f.c);
    const ant=previa&&previa.filas?previa.filas.find(x=>norm(x.c)===norm(f.c)):null;
    // los porcentajes no se acumulan; los volúmenes y las unidades sí
    const baja=(k)=>{
      const v=Number(f[k]); if(!isFinite(v)||f[k]===''||f[k]===null) return '';
      if(noAcum||!ant) return v;
      const a=Number(ant[k]);
      return (isFinite(a)&&ant[k]!==''&&ant[k]!==null)?Math.round((v-a)*100)/100:v;
    };
    const auto=REAL.find(x=>x.re.test(f.c));
    const min=baja('min'), max=baja('max');
    const real=auto?(auto.v||''):f.real;
    const p=pctYPF(real,min,max);
    const pts=(Number(f.pts)||0)*p/100;
    if(!oc){ pos+=Number(f.pts)||0; obt+=pts; if(!min&&!max) sinObj++; }
    delMes[norm(f.c)]={min,max,real};
    const esVol=/m3/i.test(`${f.c} ${f.sub||''}`);
    const dec=v=>{const s=String(v??'');const j=s.indexOf('.');return j<0?0:Math.min(2,s.length-j-1);};
    const cel=v=>{ if(v===''||v===null||v===undefined) return '—';
      if(esVol) return nf(Number(v),0);

      return nf(Number(v),Math.abs(Number(v))>=1000?0:dec(v)); };
    return `<tr${oc?' style="opacity:.42"':''}>
      ${ed?`<td class="lb-auto"><input type="checkbox" data-oyver="${esc(f.c)}"${oc?'':' checked'}
             title="${oc?'Oculto: no se muestra ni suma':'Se muestra'}"></td>`:''}

        title="${esc(luzObj(real,min,max).rot)}"></span>
        ${fechas[norm(f.c)]?`<small>${esc(fechas[norm(f.c)])}</small>`:''}</td>
      <td class="lb-con">${esc(f.c)}${f.sub?` <span class="lb-sub-t">${esc(f.sub)}</span>`:''}${oc&&ed?' <span class="lb-sub-t">(oculto)</span>':''}</td>
      <td>${cel(min)}</td><td>${cel(max)}</td><td>${cel(real)}</td>
      <td>${nf(p,1)} %</td><td>${nf(Number(f.pts)||0,0)}</td><td>${nf(pts,1)}</td></tr>`;
  }).join('');

  return `<div class="envoltorio libre-ancho">
    ${sinObj?`<div class="aviso mal">Faltan objetivos de ${MESES_L[Number(mes)-1]} en ${sinObj} concepto${sinObj>1?'s':''}. Se cargan en la pestaña <strong>Libre</strong>, en ese mes.</div>`:''}

function avisoPago(prov,facs,contacto){
  const nro=f=>`${f.tipo?'FACTURA '+f.tipo+' ':''}${f.numero||'sin número'}`;
  const total=facs.reduce((a,f)=>a+(Number(f.importe)||0),0);
  const N='\n';
  const asunto=facs.length===1
    ? `Comprobante de pago - Factura N° ${facs[0].numero||''}`.trim()
    : `Comprobante de pago - ${facs.length} facturas`;
  const quien=(contacto&&contacto.nombre)?' '+contacto.nombre:'';
  let cuerpo=saludo()+quien+','+N+N+'Espero que se encuentre bien.'+N+N;
  if(facs.length===1){
    cuerpo+='Les adjunto el comprobante de pago correspondiente a la siguiente factura:'+N+N
          + nro(facs[0])+' por un valor de $'+nf(facs[0].importe,2)+N;
  }else{
    cuerpo+='Les adjunto el comprobante de pago correspondiente a las siguientes facturas:'+N+N
          + facs.map(f=>nro(f)+' por un valor de $'+nf(f.importe,2)).join(N)
          + N+N+'Total: $'+nf(total,2)+N;
  }
  cuerpo+=N+'Quedo a disposición por cualquier consulta.'+N+N+'Muchas gracias.'+N+'Saludos,'+N
        + (S.cfg.firmante||'Lucas Sellecchia')+N+(S.cfg.razon||'FARMEX SAIC');
  return {asunto,cuerpo,total};
}

      <span class="nom">Vencido</span><span class="guia"></span><span class="val">${nf(T.vencido,2)}<i>$</i></span></div>`:''}
    <div class="totem-total"><span class="nom">Total facturado</span><span class="val">${nf(T.total,2)}<i>$</i></span></div>
  </div>
  ${T.vencido?`<div class="aviso mal"><strong>Hay ${nf(T.vencido,2)} vencido sin pagar.</strong> Mirá el detalle en Facturas.</div>`:''}
  <div class="tarjeta">
    <h2>Por sector</h2>
    ${porSector.map(x=>`<div style="margin-bottom:11px">
      <div class="mrot"><span>${x.rot}<small style="font-weight:400;color:var(--tinta-suave)"> · ${x.n} factura${x.n===1?'':'s'}</small></span>
        <span class="num" style="font-weight:600">${nf(x.total,2)}</span></div>
      ${barra(x.total,maxS,'var(--cian)')}
      <div class="mpie">${nf(x.pagado,2)} pagado${x.pendiente?` · ${nf(x.pendiente,2)} pendiente`:''}</div>
    </div>`).join('')}
  </div>
  <div class="tarjeta">
    <h2>Por proveedor</h2>
    <p class="sub">Ordenados de mayor a menor.</p>
    ${provs.map(x=>`<div style="margin-bottom:11px">
      <div class="mrot"><span>${esc(x.p)}<small style="font-weight:400;color:var(--tinta-suave)"> · ${x.n} factura${x.n===1?'':'s'}</small></span>
        <span class="num" style="font-weight:600">${nf(x.total,2)}</span></div>
      ${barra(x.total,maxP,'#9D7CFF')}
      ${x.pendiente?`<div class="mpie">${nf(x.pendiente,2)} pendiente</div>`:''}
    </div>`).join('')}
  </div>
  ${porMedio.length?`<div class="tarjeta">
    <h2>Cómo se pagó</h2>
    <p class="sub">Solo lo que figura como pagado.</p>
    <div class="scroll"><table>
      <thead><tr><th>Medio</th><th class="num">Facturas</th><th class="num">Importe</th></tr></thead>
      <tbody>${porMedio.map(x=>`<tr><td>${esc(x.m)}</td><td class="num">${x.n}</td>
        <td class="num">${nf(x.total,2)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr class="tot"><td>Total</td><td class="num">${porMedio.reduce((a,x)=>a+x.n,0)}</td>
        <td class="num">${nf(porMedio.reduce((a,x)=>a+x.total,0),2)}</td></tr></tfoot>
    </table></div>
  </div>`:''}
  ${serie.length>1?`<div class="tarjeta">
    <h2>Mes a mes</h2>
    <p class="sub">Los últimos ${serie.length} meses con facturas.</p>
    ${serie.map(x=>`<div style="margin-bottom:11px">
      <div class="mrot"><span>${nombreMes(x.m)}</span><span class="num" style="font-weight:600">${nf(x.total,2)}</span></div>
      ${barra(x.total,maxM,x.m===mes?'var(--cian)':'#3E5E8A')}

  <div class="tarjeta">

async function tabGastos(){
  const lista=await admin('facturas',[]);
  const CT=await contactos();
  const conFecha=lista.filter(f=>f.fecha);
  const meses=[...new Set(conFecha.map(f=>f.fecha.slice(0,7)))].sort().reverse();
  if(!conFecha.length) return `<div class="tarjeta"><h2>Gastos</h2>
    <p class="vacio">Todavía no hay facturas cargadas.<br>Se cargan en Facturas, eligiendo el sector.</p></div>`;
  if(!S.gasMes) S.gasMes=meses[0];
  const mes=S.gasMes;
  const delMes=mes==='todos'?conFecha:conFecha.filter(f=>f.fecha.slice(0,7)===mes);
  const hoy=hoyISO();

  const tot=arr=>{
    const t=arr.reduce((a,f)=>a+(Number(f.importe)||0),0);
    const pag=arr.filter(f=>f.estado==='pagada').reduce((a,f)=>a+(Number(f.importe)||0),0);
    const venc=arr.filter(f=>f.estado!=='pagada'&&f.vence&&f.vence<hoy).reduce((a,f)=>a+(Number(f.importe)||0),0);
    return {t,pag,pend:t-pag,venc,n:arr.length};
  };
  const G=tot(delMes);

  const porSector=SECT_FAC.map(([k,rot])=>({k,rot,...tot(delMes.filter(f=>(f.sector||'admin')===k))}))
    .filter(x=>x.n).sort((a,b)=>b.t-a.t);
  const provs=[...new Set(delMes.map(f=>f.proveedor||'Sin proveedor'))]
    .map(p=>({p,...tot(delMes.filter(f=>(f.proveedor||'Sin proveedor')===p))}))
    .sort((a,b)=>b.t-a.t);
  const maxS=Math.max(...porSector.map(x=>x.t),1);
  const maxP=Math.max(...provs.map(x=>x.t),1);
  const COL=['#22E3F5','#9D7CFF','#3DE0A0','#FF6B85','#FFB86B','#5B8DEF','#6FD3C7','#C08AE0'];

  // evolución mensual, para ver si el gasto sube o baja
  const serie=meses.slice(0,12).reverse().map(m=>({m,...tot(conFecha.filter(f=>f.fecha.slice(0,7)===m))}));
  const maxM=Math.max(...serie.map(x=>x.t),1);

  const barra=(v,max,color)=>`<div class="hbarras"><div class="hb">
    <i style="width:${v/max*100}%;background:${color}"></i><em>${nf(v,2)}</em></div></div>`;

  return `<div class="filtro"><span class="et">Mes</span>
    <select id="gasMes">
      <option value="todos"${mes==='todos'?' selected':''}>Todos los meses</option>
      ${meses.map(m=>`<option value="${m}"${mes===m?' selected':''}>${nombreMes(m)}</option>`).join('')}</select>
  </div>
  <div class="totem">
    <div class="totem-cab"><div class="t">Gastos · ${mes==='todos'?'todo el período':nombreMes(mes)}</div>
      <div class="d">${G.n} factura${G.n===1?'':'s'}</div></div>
    <div class="linea-totem"><span class="chip" style="background:var(--ok)"></span>
      <span class="nom">Pagado</span><span class="guia"></span><span class="val">${nf(G.pag,2)}<i>$</i></span></div>
    <div class="linea-totem"><span class="chip" style="background:var(--ambar)"></span>
      <span class="nom">Pendiente</span><span class="guia"></span><span class="val">${nf(G.pend,2)}<i>$</i></span></div>
    ${G.venc?`<div class="linea-totem"><span class="chip" style="background:var(--alerta)"></span>
      <span class="nom">Vencido</span><span class="guia"></span><span class="val">${nf(G.venc,2)}<i>$</i></span></div>`:''}
    <div class="totem-total"><span class="nom">Total facturado</span><span class="val">${nf(G.t,2)}<i>$</i></span></div>
  </div>
  ${G.venc?`<div class="aviso mal">Hay <strong>${nf(G.venc,2)}</strong> en facturas vencidas sin pagar.</div>`:''}
  <div class="tarjeta">
    <h2>Por sector</h2>
    <div class="hgraf">${porSector.map((x,i)=>`<div class="hfila">
      <div class="hnom">${esc(x.rot)}</div>${barra(x.t,maxS,COL[i%COL.length])}</div>`).join('')}</div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Sector</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${porSector.map(x=>`<tr><td>${esc(x.rot)}</td><td class="num">${x.n}</td>
        <td class="num"><strong>${nf(x.t,2)}</strong></td><td class="num">${nf(x.pag,2)}</td>
        <td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
      <tfoot><tr class="tot"><td>Total</td><td class="num">${G.n}</td><td class="num">${nf(G.t,2)}</td>
        <td class="num">${nf(G.pag,2)}</td><td class="num">${nf(G.pend,2)}</td></tr></tfoot>
    </table></div>
  </div>
  <div class="tarjeta">
    <h2>Por proveedor</h2>
    <p class="sub">${provs.length} proveedor${provs.length===1?'':'es'} en ${mes==='todos'?'todo el período':nombreMes(mes)}.</p>
    <div class="hgraf">${provs.slice(0,12).map((x,i)=>`<div class="hfila">
      <div class="hnom" style="font-size:11.5px">${esc(x.p)}</div>${barra(x.t,maxP,COL[i%COL.length])}</div>`).join('')}</div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Proveedor</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${provs.map(x=>`<tr><td>${esc(x.p)}${(CT[x.p]||{}).nombre?`<small>${esc(CT[x.p].nombre)}</small>`:''}</td>
        <td class="num">${x.n}</td><td class="num"><strong>${nf(x.t,2)}</strong></td>
        <td class="num">${nf(x.pag,2)}</td><td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>
  ${serie.length>1?`<div class="tarjeta">
    <h2>Mes por mes</h2>
    <p class="sub">Total facturado en cada mes.</p>
    <div class="vgraf"><div class="vcols">${serie.map(x=>`<div class="vcol">
      <div class="vbarras"><div class="vb" style="width:66%;max-width:30px">
        <i style="height:${x.t/maxM*100}%;background:${x.m===mes?'var(--cian)':'#3E5E8A'}"></i></div></div>
      <div class="vet">${MESES[Number(x.m.slice(5,7))-1]}</div></div>`).join('')}</div></div>
    <div class="scroll" style="margin-top:11px"><table>
      <thead><tr><th>Mes</th><th class="num">Facturas</th><th class="num">Total</th><th class="num">Pendiente</th></tr></thead>
      <tbody>${serie.slice().reverse().map(x=>`<tr><td>${nombreMes(x.m)}</td><td class="num">${x.n}</td>
        <td class="num"><strong>${nf(x.t,2)}</strong></td><td class="num ${x.pend?'nocumple':''}">${nf(x.pend,2)}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>`:''}
  <div class="tarjeta">
    <h2>Medios de pago</h2>
    ${(()=>{
      const pagadas=delMes.filter(f=>f.estado==='pagada');
      const med={};
      pagadas.forEach(f=>{ const k=f.medio||'Sin especificar'; med[k]=(med[k]||0)+(Number(f.importe)||0); });
      const ent=Object.entries(med).sort((a,b)=>b[1]-a[1]);
      if(!ent.length) return `<p class="vacio">Ninguna factura pagada en este mes.</p>`;
      const mx=Math.max(...ent.map(e=>e[1]),1);
      return `<div class="hgraf">${ent.map(([k,v],i)=>`<div class="hfila">
        <div class="hnom" style="font-size:11.5px">${esc(k)}</div>${barra(v,mx,COL[i%COL.length])}</div>`).join('')}</div>`;
    })()}
  </div>`;
}
